services:
  - type: web
    name: vidmahi
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /api/health
    disk:
      name: vidmahi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/vidmahi.sqlite3
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: VIDMAHI_ACCESS_TOKEN
        generateValue: true
      - key: VIDMAHI_AGENT_TOKEN
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENROUTER_MODEL
        value: openai/gpt-4.1
